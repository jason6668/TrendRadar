name: Keepalive

on:
  schedule:
    - cron: '0 0 */15 * *'  # 每15天运行一次，确保活跃
  workflow_dispatch:      # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Auto commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 获取最后一次提交的时间
          last_commit_date=$(git log -1 --format=%ct)
          current_date=$(date +%s)
          days_diff=$(( (current_date - last_commit_date) / 86400 ))
          
          echo "距离上次提交已过去 $days_diff 天"
          
          # 如果超过 50 天没有提交，则强制提交一次 (GitHub 限制通常是 60 天)
          # 或者直接每次运行都提交，这里设置为每次运行都提交一个空 commit 以确保万无一失
          
          git commit --allow-empty -m "keepalive: 自动保活签到 [$(date -u)]"
          git push
